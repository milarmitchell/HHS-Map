<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hinkley High School — Floor Plan Finder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F3F1EA;
    --ink:#232323;
    --sub:#6b665c;
    --line:#d8d0ba;
    --corridor:#c9c2aa;

    --red:#B9342A;    --red-bg:#F3CDC7;
    --gold:#9A6B00;   --gold-bg:#F7E9A6;
    --green:#2E7D32;  --green-bg:#C9E3C9;
    --blue:#1F6FB2;   --blue-bg:#C6DDF0;
    --purple:#7B4B94; --purple-bg:#DEC7EC;
    --pink:#B0225A;   --pink-bg:#F4C4D9;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:100;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    padding:12px 14px 10px;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:1.05rem;
    margin:0 0 8px;
  }
  .searchwrap{position:relative; margin-bottom:8px;}
  #search{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:1rem;
    padding:11px 40px 11px 14px;
    border:2px solid var(--ink);
    border-radius:10px;
    background:#fff;
  }
  #search:focus{outline:3px solid var(--gold); outline-offset:0;}
  .clearbtn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; font-size:1.1rem; color:var(--sub);
    cursor:pointer; display:none; padding:6px;
  }
  #searchresults{
    position:absolute; left:0; right:0; top:calc(100% + 4px);
    background:#fff; border:2px solid var(--ink); border-radius:10px;
    max-height:60vh; overflow-y:auto; display:none; z-index:200;
  }
  #searchresults.show{display:block;}
  .sr-count{font-size:0.75rem; color:var(--sub); padding:8px 12px 2px;}
  .sr-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-top:1px solid var(--line);
    cursor:pointer;
  }
  .sr-item:active{background:#f2f0e8;}
  .sr-num{font-family:'Archivo',sans-serif; font-weight:800; font-size:1rem; min-width:52px;}
  .sr-meta{font-size:0.78rem; color:var(--sub); flex:1;}
  .sr-floorpill{
    font-size:0.65rem; font-weight:700; padding:3px 7px; border-radius:20px;
    background:var(--ink); color:var(--paper); white-space:nowrap;
  }
  .sr-none{padding:14px 12px; color:var(--sub); font-size:0.85rem;}
  .sr-dupe{padding:8px 12px; font-size:0.72rem; color:var(--red); background:#FBEAEA; border-top:1px solid var(--line);}

  .floortabs{display:flex; gap:8px;}
  .floortab{
    flex:1; font-family:'Archivo',sans-serif; font-weight:700; font-size:0.82rem;
    padding:8px 6px; text-align:center; border:2px solid var(--ink); border-radius:8px;
    background:#fff; color:var(--ink); cursor:pointer;
  }
  .floortab.active{background:var(--ink); color:var(--paper);}

  .floorplan{display:none;}
  .floorplan.active{display:block;}

  .scrollhint{
    font-size:0.72rem; color:var(--sub); text-align:center;
    padding:8px 0 2px;
  }

  .topstrip{
    display:flex; gap:10px; flex-wrap:wrap;
    padding:12px 12px 4px;
  }
  .mainstrip{
    display:flex; gap:10px;
    overflow-x:auto;
    padding:6px 12px 24px;
    scroll-padding:0 12px;
    -webkit-overflow-scrolling:touch;
  }

  .hallway{
    flex:0 0 auto;
    width:150px;
    display:flex; flex-direction:column;
    border-radius:10px;
    overflow:hidden;
    border:2px solid var(--ink);
    background:#fff;
    scroll-margin:0 12px;
  }
  .hallway.wide{width:180px;}
  .hallway.narrow{width:120px;}
  .hallway-head{
    font-family:'Archivo',sans-serif; font-weight:800; font-size:0.72rem;
    line-height:1.2;
    padding:8px 8px;
    color:#fff;
    text-align:center;
  }
  .hallway-head.red{background:var(--red);}
  .hallway-head.gold{background:var(--gold);}
  .hallway-head.green{background:var(--green);}
  .hallway-head.blue{background:var(--blue);}
  .hallway-head.purple{background:var(--purple);}
  .hallway-head.pink{background:var(--pink);}
  .hallway-head.void{background:var(--sub);}

  .roomstack{display:flex; flex-direction:column; flex:1;}
  .room{
    padding:9px 8px;
    border-bottom:1px solid var(--line);
    font-size:0.78rem;
    scroll-margin:120px 0 0 0;
    transition:background 0.3s;
  }
  .room:last-child{border-bottom:none;}
  .room .num{font-family:'Archivo',sans-serif; font-weight:800; font-size:0.92rem; display:block;}
  .room .type{color:var(--sub); font-size:0.7rem;}
  .room.red{background:var(--red-bg);}
  .room.gold{background:var(--gold-bg);}
  .room.green{background:var(--green-bg);}
  .room.blue{background:var(--blue-bg);}
  .room.purple{background:var(--purple-bg);}
  .room.pink{background:var(--pink-bg);}
  .room.hit{
    background:#FFE066 !important;
    box-shadow: inset 0 0 0 3px var(--ink);
    animation: pulse 1.2s ease-in-out 2;
  }
  @keyframes pulse{
    0%,100%{box-shadow: inset 0 0 0 3px var(--ink);}
    50%{box-shadow: inset 0 0 0 3px var(--ink), 0 0 0 6px #FFE06699;}
  }

  .courtyard{
    background:repeating-linear-gradient(45deg, #eae5d6, #eae5d6 6px, #f3f0e6 6px, #f3f0e6 12px);
    display:flex; align-items:center; justify-content:center; text-align:center;
    flex:1; min-height:200px;
    font-family:'Archivo',sans-serif; font-weight:700; font-size:0.8rem; color:var(--sub);
    padding:10px;
  }

  .exit{
    background:#fff; border-top:2px dashed var(--ink);
    padding:8px; font-size:0.68rem; font-weight:700; text-align:center; color:var(--ink);
  }

  .corridor{
    flex:0 0 auto; width:14px; align-self:stretch;
    background:repeating-linear-gradient(180deg, var(--corridor), var(--corridor) 4px, transparent 4px, transparent 8px);
  }

  .note{
    margin:0 12px 20px; font-size:0.76rem; color:var(--sub); line-height:1.5;
    background:#fff; border:1.5px dashed var(--line); border-radius:10px; padding:12px 14px;
  }
  .note b{color:var(--ink);}
</style>
</head>
<body>

<div class="topbar">
  <h1>W.C. Hinkley High School — Floor Plan Finder</h1>
  <div class="searchwrap">
    <input id="search" type="text" inputmode="search" placeholder="Search a room number..." autocomplete="off">
    <button class="clearbtn" id="clearbtn" aria-label="Clear">✕</button>
    <div id="searchresults"></div>
  </div>
  <div class="floortabs">
    <div class="floortab active" data-floor="2">2nd Floor</div>
    <div class="floortab" data-floor="1">1st Floor</div>
  </div>
</div>

<div class="scrollhint">👉 swipe sideways through the floor plan — search jumps straight to a room</div>

<div id="floor2" class="floorplan active"></div>
<div id="floor1" class="floorplan"></div>

<script>

/* ============ BUILD ============ */
function hallwayHTML(h){
  const cls = h.width ? `hallway ${h.width}` : 'hallway';
  let inner = `<div class="hallway-head ${h.color}">${h.label}</div>`;
  if(h.courtyard){
    inner += `<div class="courtyard">${h.label}<br><span style="font-weight:400;font-size:0.7rem;">(open area)</span></div>`;
  }
  inner += `<div class="roomstack">`;
  h.rooms.forEach(r=>{
    inner += `<div class="room ${h.color}" data-num="${r.n}"><span class="num">${r.n}</span><span class="type">${r.t}</span></div>`;
  });
  inner += `</div>`;
  if(h.exit){
    inner += `<div class="exit">🚪 ${h.exit}</div>`;
  }
  return `<div class="${cls}" id="${h.wrapId}">${inner}</div>`;
}

function buildFloor(containerId, data, floorNum){
  const el = document.getElementById(containerId);
  let html = `<div class="topstrip">`;
  data.top.forEach(h=>{ h.wrapId = `f${floorNum}-${h.key}`; html += hallwayHTML(h); });
  html += `</div><div class="mainstrip">`;
  data.main.forEach(h=>{ h.wrapId = `f${floorNum}-${h.key}`; html += hallwayHTML(h); });
  html += `</div>`;

  html += `<div class="note"><b>A note on accuracy:</b> this is redrawn from a hand-colored, hand-labeled floor plan (2nd floor dated 2020&ndash;21, 1st floor dated 2021&ndash;22, both marked "DRAFT," updated 1/21/2026) — it's straightened out for readability, so hallway columns are shown in the correct left-to-right / top-to-bottom order but not to exact architectural scale. A few very faint closet and storage numbers were left off rather than guessed.
  <br><br><b>⚠️ Room 1406 appears twice on the 1st floor</b> — once as the Band Room and once as a Science room, in different wings. That's how it's labeled on the original map, not a mistake in this rebuild — worth confirming with the front office which one you actually need.</div>`;

  el.innerHTML = html;
}

buildFloor('floor2', FLOOR2, 2);
buildFloor('floor1', FLOOR1, 1);

/* ============ TABS ============ */
document.querySelectorAll('.floortab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.floortab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const f = tab.dataset.floor;
    document.getElementById('floor1').classList.toggle('active', f==='1');
    document.getElementById('floor2').classList.toggle('active', f==='2');
  });
});

/* ============ SEARCH ============ */
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearbtn');
const resultsBox = document.getElementById('searchresults');

function collectRooms(data, floor){
  const out = [];
  [...data.top, ...data.main].forEach(h=>{
    h.rooms.forEach(r=>{
      if(r.n && r.n !== '—'){
        out.push({num:r.n, type:r.t, wing:h.label, hallwayId:h.wrapId, floor});
      }
    });
  });
  return out;
}
const ROOMS = [...collectRooms(FLOOR2,2), ...collectRooms(FLOOR1,1)];

function runSearch(q){
  q = q.trim();
  clearBtn.style.display = q ? 'block' : 'none';
  document.querySelectorAll('.room').forEach(r=>r.classList.remove('hit'));

  if(!q){ resultsBox.classList.remove('show'); resultsBox.innerHTML=''; return; }

  const matches = ROOMS.filter(r => r.num.toLowerCase().includes(q.toLowerCase()));
  resultsBox.classList.add('show');

  if(matches.length === 0){
    resultsBox.innerHTML = `<div class="sr-none">No room matching "${q}".</div>`;
    return;
  }

  let html = `<div class="sr-count">${matches.length} match${matches.length!==1?'es':''}</div>`;
  matches.slice(0,20).forEach((m,i)=>{
    html += `<div class="sr-item" data-idx="${i}">
      <span class="sr-num">${m.num}</span>
      <span class="sr-meta">${m.type} · ${m.wing}</span>
      <span class="sr-floorpill">Floor ${m.floor}</span>
    </div>`;
  });
  resultsBox.innerHTML = html;

  resultsBox.querySelectorAll('.sr-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const m = matches[parseInt(item.dataset.idx)];
      goToRoom(m);
    });
  });
}

function goToRoom(m){
  document.querySelectorAll('.floortab').forEach(t=>t.classList.toggle('active', t.dataset.floor==String(m.floor)));
  document.getElementById('floor1').classList.toggle('active', m.floor===1);
  document.getElementById('floor2').classList.toggle('active', m.floor===2);
  resultsBox.classList.remove('show');

  setTimeout(()=>{
    const hallwayEl = document.getElementById(m.hallwayId);
    if(!hallwayEl) return;
    const roomEl = hallwayEl.querySelector(`.room[data-num="${CSS.escape(m.num)}"]`);
    if(roomEl){
      hallwayEl.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      setTimeout(()=>{
        roomEl.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
        roomEl.classList.add('hit');
      }, 250);
    }
  }, 80);
}

searchInput.addEventListener('input', e => runSearch(e.target.value));
clearBtn.addEventListener('click', ()=>{ searchInput.value=''; runSearch(''); searchInput.focus(); });
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.searchwrap')) resultsBox.classList.remove('show');
});
</script>

</html>
